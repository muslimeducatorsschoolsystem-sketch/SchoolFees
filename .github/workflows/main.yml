name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o '*.zip'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get Gradle
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
      - name: Build APK
        working-directory: MESFees
        run: ../gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
      - run: cp MESFees/app/build/outputs/apk/debug/app-debug.apk MES-Fees.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MES-Fees-APK
          path: MES-Fees.apk
