name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o '*.zip'
          ls -R MESFees | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: MESFees
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp MESFees/app/build/outputs/apk/debug/app-debug.apk MES-Fees.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MES-Fees-APK
          path: MES-Fees.apk
